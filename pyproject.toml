[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hot-list"
version = "0.1.0"
description = "Extensible multi-platform hot-list collection service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0.41,<3.0",
  "aiosqlite>=0.21,<1.0",
  "apscheduler>=3.10.4,<4.0",
  "asyncmy>=0.2.10,<1.0",
  "tenacity>=8.5,<10.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
hot-list = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["database", "services", "spider", "tools", "web"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
packages = ["database", "services", "spider", "tools", "web"]
