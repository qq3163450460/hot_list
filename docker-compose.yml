services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    env_file:
      - path: .env
        required: false
    environment:
      HOT_LIST_DATABASE_URL: sqlite+aiosqlite:////app/data/hot_list.db
      HOT_LIST_DEBUG: "false"
    volumes:
      - hot_list_data:/app/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  hot_list_data:
